name: Release

# Cuts a plugin release from a v* tag. CI builds the package and updates what
# main advertises, so a release never depends on a local build and main never
# points at a version whose asset and SHA are not live yet.
#
# Order: build, publish the GitHub release, confirm the asset is reachable, and
# only then write <!ENTITY version> and <SHA256> into plugin/bombvaultwidget.plg
# on main. Unraid reads that .plg from raw main and checks the .txz against its
# <SHA256>, so main has to change last; if anything earlier fails, main still
# advertises the previous version and re-running the tag heals it.
#
# To release, add a "### X.Y.Z" block to the .plg's <CHANGES> and tag vX.Y.Z on
# main. CI sets <!ENTITY version>; bumping it by hand early reopens the window
# in which main advertises an asset that is not live.
#
# workflow_dispatch is a dry run: it builds the .txz and uploads it as an
# artifact, with no release and no change to main.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bombvaultwidget-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .txz package
        run: bash plugin/pkg_build.sh "${{ steps.v.outputs.version }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bombvaultwidget-txz
          path: plugin/out/*

      # The steps below run for tags only.
      - name: Extract release notes from .plg CHANGES
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="${{ steps.v.outputs.version }}"
          awk -v v="### $ver" '$0==v{grab=1;next} grab&&/^### /{exit} grab{print}' \
            plugin/bombvaultwidget.plg > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no '### $ver' block in plugin/bombvaultwidget.plg <CHANGES>; add it before tagging"
            exit 1
          fi
          echo "---- release notes ----"; cat release-notes.md

      - name: Publish release (asset goes live first)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            plugin/out/bombvaultwidget-*-x86_64-1.txz
            plugin/out/bombvaultwidget-*-x86_64-1.txz.sha256

      - name: Confirm the release asset is reachable
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="${{ steps.v.outputs.version }}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${ver}/bombvaultwidget-${ver}-x86_64-1.txz"
          for i in $(seq 1 10); do
            code=$(curl -fsSL -o /dev/null -w '%{http_code}' -I "$url" || true)
            [ "$code" = "200" ] && { echo "asset live: $url"; exit 0; }
            echo "waiting for asset ($code) ..."; sleep 3
          done
          echo "::error::release asset not reachable: $url"; exit 1

      - name: Flip version + SHA256 in bombvaultwidget.plg on main (final step)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="${{ steps.v.outputs.version }}"
          txz="plugin/out/bombvaultwidget-${ver}-x86_64-1.txz"
          sha="$(sha256sum "$txz" | awk '{print $1}')"
          echo "package sha256 = $sha"
          sed -i -E "s#(<!ENTITY version[[:space:]]+\")[^\"]*(\">)#\1${ver}\2#" plugin/bombvaultwidget.plg
          sed -i -E "s#<SHA256>[0-9a-fA-F]{64}</SHA256>#<SHA256>${sha}</SHA256>#" plugin/bombvaultwidget.plg
          grep -q "<SHA256>${sha}</SHA256>" plugin/bombvaultwidget.plg \
            || { echo "::error::SHA256 not written into bombvaultwidget.plg"; exit 1; }
          grep -qE "<!ENTITY version[[:space:]]+\"${ver}\">" plugin/bombvaultwidget.plg \
            || { echo "::error::version not written into bombvaultwidget.plg"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- plugin/bombvaultwidget.plg; then
            echo "bombvaultwidget.plg already current, nothing to commit"
          else
            git add plugin/bombvaultwidget.plg
            git commit -m "ci: release v${ver}, pin version and package SHA256 [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
